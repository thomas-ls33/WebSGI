server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: websgi-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/websgi}
    username: ${DB_USERNAME:websgi}
    password: ${DB_PASSWORD:websgi}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

websgi:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:changez-cette-cle-secrete-en-production-au-moins-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@websgi.fr}
    seed-password: ${ADMIN_SEED_PASSWORD:admin123}
