name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une nouvelle exécution annule l'ancienne sur la même branche ou PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Un workflow de CI n'a besoin que de lire le code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest

    # Base PostgreSQL jetable pour les tests d'intégration.
    # Les valeurs correspondent aux défauts de src/test/resources/application-test.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: websgi_test
          POSTGRES_USER: websgi
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U websgi -d websgi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: websgi-backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compiler et lancer les tests
        run: mvn --batch-mode verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/websgi_test
          TEST_DB_USERNAME: websgi
          TEST_DB_PASSWORD: password

      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: websgi-backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: websgi-frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: websgi-frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (build des images)
    runs-on: ubuntu-latest
    # On ne construit les images que si le code est déjà validé.
    needs: [backend, frontend]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: websgi-backend
          - name: frontend
            context: websgi-frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: websgi-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
