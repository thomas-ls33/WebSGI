name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/thomas-ls33
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publier l'image ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: websgi-backend
          - name: frontend
            context: websgi-frontend

    steps:
      - name: Récupérer le code du commit validé
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/websgi-${{ matrix.name }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/websgi-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Déployer sur la VM
    runs-on: ubuntu-latest
    needs: publish

    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      SSH_OPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15

    steps:
      - name: Préparer la connexion SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Se connecter au registre depuis la VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh $SSH_OPTS "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

      - name: Mettre à jour et relancer la stack
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh $SSH_OPTS "$VM_USER@$VM_HOST" "IMAGE_TAG=$SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/WebSGI
          git fetch origin
          git merge --ff-only "$IMAGE_TAG"
          export IMAGE_TAG
          docker compose pull backend frontend
          docker compose up -d --no-build
          docker image prune -f
          REMOTE

      - name: Test de fumée
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          for attempt in $(seq 1 18); do
            site=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$VM_HOST/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "http://$VM_HOST/api/auth/login" \
              -H 'Content-Type: application/json' \
              -d '{"email":"smoke-test@invalid.example","password":"invalide-123"}' || true)
            echo "Tentative $attempt : site=$site api=$api"
            if [ "$site" = "200" ] && [ "$api" = "401" ]; then
              echo "Déploiement vérifié."
              exit 0
            fi
            sleep 5
          done
          echo "Le site ne répond pas correctement après le déploiement." >&2
          exit 1

      - name: Journaux de la VM en cas d'échec
        if: failure()
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh $SSH_OPTS "$VM_USER@$VM_HOST" \
            "cd ~/WebSGI && docker compose ps && docker compose logs --tail=40 backend" || true
