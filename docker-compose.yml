services:

  postgres:
    image: postgres:16
    container_name: websgi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: websgi
      POSTGRES_USER: websgi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websgi -d websgi"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - websgi-network


  backend:
    # En production : image publiée par la CI (IMAGE_TAG = SHA du commit déployé).
    # En local : "docker compose up --build" construit l'image et la nomme pareil.
    image: ghcr.io/thomas-ls33/websgi-backend:${IMAGE_TAG:-latest}
    build:
      context: ./websgi-backend

    container_name: websgi-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/websgi
      DB_USERNAME: websgi
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre defini dans le .env}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@websgi.fr}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD doit etre defini dans le .env}

    expose:
      - "8080"

    networks:
      - websgi-network


  frontend:
    image: ghcr.io/thomas-ls33/websgi-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./websgi-frontend

    container_name: websgi-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - websgi-network


volumes:
  postgres_data:


networks:
  websgi-network:
